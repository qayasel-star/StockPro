
name: Descomprimir ZIP en el repositorio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir StockPro
        run: |
          ZIP="StockPro_entrega_auditoria_01.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No se encuentra el ZIP: $ZIP"
            exit 1
          fi
          unzip -o "$ZIP" -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Descomprimir archivos de StockPro"
            git push
          fi
          
